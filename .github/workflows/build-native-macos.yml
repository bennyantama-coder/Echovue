name: Build EchoVue Native macOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'native/**'
      - '.github/workflows/build-native-macos.yml'

permissions:
  contents: read

jobs:
  build-apple-silicon:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SwiftUI app
        shell: bash
        run: |
          set -euo pipefail
          cd native
          xcodebuild -version
          swift --version
          swift build -c release --arch arm64

      - name: Assemble EchoVue.app
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/native"
          DIST="$GITHUB_WORKSPACE/dist"
          APP="$DIST/EchoVue.app"
          CONTENTS="$APP/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"
          TOOLS="$RESOURCES/Tools"

          rm -rf "$DIST"
          mkdir -p "$MACOS" "$TOOLS"

          BIN=""
          for CANDIDATE in             "$ROOT/.build/arm64-apple-macosx/release/EchoVueMac"             "$ROOT/.build/release/EchoVueMac"
          do
            if [ -x "$CANDIDATE" ]; then
              BIN="$CANDIDATE"
              break
            fi
          done

          if [ -z "$BIN" ]; then
            echo "EchoVueMac binary not found"
            find "$ROOT/.build" -type f -name EchoVueMac -print || true
            exit 2
          fi

          cp "$BIN" "$MACOS/EchoVue"
          chmod +x "$MACOS/EchoVue"

          cat > "$CONTENTS/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key><string>EchoVue</string>
            <key>CFBundleExecutable</key><string>EchoVue</string>
            <key>CFBundleIdentifier</key><string>com.bennyantama.echovue</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>EchoVue</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.3.1</string>
            <key>CFBundleVersion</key><string>4</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          FFMPEG_URL="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64"
          FFMPEG_SHA256="a90e3db6a3fd35f6074b013f948b1aa45b31c6375489d39e572bea3f18336584"

          curl -fL --retry 3 --retry-delay 2             -o "$TOOLS/ffmpeg"             "$FFMPEG_URL"

          echo "$FFMPEG_SHA256  $TOOLS/ffmpeg" | shasum -a 256 -c -
          chmod +x "$TOOLS/ffmpeg"

          curl -fL --retry 3 --retry-delay 2             -o "$RESOURCES/FFMPEG_LICENSE.txt"             "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/darwin-arm64.LICENSE"

          /usr/bin/codesign --force --deep --sign - "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail

          DIST="$GITHUB_WORKSPACE/dist"
          APP="$DIST/EchoVue.app"
          ZIP="$DIST/EchoVue-macOS-AppleSilicon-v0.3.1.zip"
          DMG="$DIST/EchoVue-macOS-AppleSilicon-v0.3.1.dmg"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

          STAGE="$RUNNER_TEMP/echovue-dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp -R "$APP" "$STAGE/EchoVue.app"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create             -volname "EchoVue"             -srcfolder "$STAGE"             -ov             -format UDZO             "$DMG"

          shasum -a 256 "$ZIP" "$DMG" | tee "$DIST/SHA256SUMS.txt"
          ls -lh "$DIST"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EchoVue-macOS-AppleSilicon-v0.3.1
          path: |
            dist/EchoVue-macOS-AppleSilicon-v0.3.1.dmg
            dist/EchoVue-macOS-AppleSilicon-v0.3.1.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
